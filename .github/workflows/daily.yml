name: Daily report

on:
  schedule:
    # 13:10 UTC on weekdays = 09:10 ET during EDT, 08:10 ET during EST.
    # GitHub cron is always UTC and has no DST. Add a second line in winter if
    # you want it pinned to 09:10 ET year-round.
    - cron: '10 13 * * *'
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      dry_run:
        description: 'Fetch and score without writing or committing'
        type: boolean
        default: false

permissions:
  contents: write             # required to commit the new report
  pages: write
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's report
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 generate_report.py --dry-run
          else
            python3 generate_report.py
          fi

      - name: Commit the new report
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/history.json index.html
          if git diff --staged --quiet; then
            echo "Nothing changed — not committing."
          else
            git commit -m "report: $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
        if: ${{ inputs.dry_run != true }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.dry_run != true }}
        with:
          path: .
      - id: deployment
        if: ${{ inputs.dry_run != true }}
        uses: actions/deploy-pages@v4
