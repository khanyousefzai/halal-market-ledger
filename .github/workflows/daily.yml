name: Daily report

on:
  schedule:
    # 13:10 UTC on weekdays = 09:10 ET during EDT, 08:10 ET during EST.
    # GitHub cron is always UTC and has no DST. Add a second line in winter if
    # you want it pinned to 09:10 ET year-round.
    # Weekdays only (markets are closed at weekends). Two lines so Monday runs once:
    # the Monday run also refreshes the ML forecasts.
    # If you change the Monday line, update ML_CRON below to match.
    - cron: '10 13 * * 2-5'
    - cron: '10 13 * * 1'
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      dry_run:
        description: 'Fetch and score without writing or committing'
        type: boolean
        default: false
      run_ml:
        description: 'Also refresh the ML forecasts (normally weekly, on Mondays)'
        type: boolean
        default: false

env:
  ML_CRON: '10 13 * * 1'

permissions:
  contents: write             # required to commit the new report
  pages: write
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # fail a hung deploy instead of waiting hours
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Jupyter kernel
        run: python3 -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Generate today's report
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 generate_report.py --dry-run
          else
            python3 generate_report.py
          fi

      - name: Generate ML Analysis (weekly)
        if: ${{ github.event.schedule == env.ML_CRON || inputs.run_ml }}
        run: |
          python3 run_advanced_ml.py

      - name: Commit the new report
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git add -A
          echo "Status before commit:"
          git status --porcelain
          if git diff --staged --quiet; then
            echo "Nothing changed — not committing."
          else
            git commit -m "report: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - uses: actions/configure-pages@v5
        if: ${{ inputs.dry_run != true }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.dry_run != true }}
        with:
          path: .
      - id: deployment
        if: ${{ inputs.dry_run != true }}
        uses: actions/deploy-pages@v4
