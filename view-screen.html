<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="0;URL='reports/2026-10-13.html'">
<title>Redirecting...</title>
</head>
<body>
<p>Redirecting to today's report...</p>
<script>
fetch('data/history.json')
  .then(r => r.json())
  .then(data => {
    if(data && data.length) {
      const latest = data.sort((a,b) => b.date.localeCompare(a.date))[0];
      window.location = 'reports/' + latest.date + '.html';
    }
  });
</script>
</body>
</html>
